<head>

<title>Ny hjemmeside</title>
<style>
 :root{color-scheme:light}
 html,body{height:100%;margin:0;background:#fff;color:#1a1d21;
   font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 form{min-height:100%;display:flex;flex-direction:column;justify-content:center;
   gap:13px;max-width:22rem;margin:0 auto;padding:24px}
 h1{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 1px}
 p.sub{margin:0 0 8px;font-size:13.5px;color:#5b6470}
 input[type=password]{font-size:17px;padding:14px;border-radius:10px;border:1px solid #d9d9dd;
   background:#fff;color:#1a1d21;width:100%;box-sizing:border-box}
 input[type=password]:focus{outline:2px solid #2c4a6b;outline-offset:1px;border-color:transparent}
 button{font-size:17px;padding:14px;border-radius:10px;border:0;background:#1a1d21;color:#fff;
   font-weight:600;cursor:pointer}
 button[disabled]{opacity:.45}
 label.rm{display:flex;align-items:center;gap:9px;font-size:14px;color:#5b6470;cursor:pointer;
   user-select:none;padding:2px 0}
 label.rm input{width:17px;height:17px;accent-color:#2c4a6b;margin:0}
 #msg{min-height:1.4em;margin:0;font-size:13.5px;color:#8b95a1}
 #msg.err{color:#b03a3a}
 .off{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<form id="f" autocomplete="off" action="#">

  <p class="sub">Skriv den adgangskode, du har fået.</p>
  <input id="pw" type="password" name="pv-code" autocomplete="off" data-lpignore="true" data-1p-ignore

         placeholder="Adgangskode" aria-label="Adgangskode" required>
  <label class="rm"><input type="checkbox" id="rm"> Husk mig på denne enhed</label>
  <button id="go" type="submit">Åbn</button>
  <p id="msg" role="status" aria-live="polite"></p>
</form>

<script>
(function(){
  var ITER = 310000, BUILD = '0e4c56dc8cc8';
  var SK = 'pv.plain.' + location.pathname + BUILD;          // per build, so a new build is never served from cache
  var PK = 'pv.pass.' + location.pathname;                    // only written when "remember me" is ticked
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), rm = document.getElementById('rm'),
      msg = document.getElementById('msg');

  function safe(fn, d){ try { return fn(); } catch(e) { return d; } }

  // Drop any plaintext cached by an older build. This is the fix for "I do not
  // see the update": the old shell keyed the cache by a constant.
  safe(function(){
    [sessionStorage, localStorage].forEach(function(st){
      for (var i = st.length - 1; i >= 0; i--) {
        var k = st.key(i);
        if (k && k.indexOf('pv.plain.' + location.pathname) === 0 && k !== SK) st.removeItem(k);
      }
    });
  });

  function render(html){
    safe(function(){ sessionStorage.setItem(SK, html); });
    // document.write, not innerHTML: injected <script> elements are flagged
    // already-started by the parser and would never run.
    document.open(); document.write(html); document.close();
  }

  var cached = safe(function(){ return sessionStorage.getItem(SK); }, null);
  if (cached) { render(cached); return; }

  if (!window.isSecureContext || !crypto.subtle) {
    msg.className = 'err';
    msg.textContent = 'Åbn linket med https://, ikke en downloadet kopi.';
    go.disabled = true; return;
  }

  function b64(s){ var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  function unlock(pass, remember, quiet){
    go.disabled = true; msg.className = '';
    msg.textContent = quiet ? 'Åbner...' : 'Åbner...';
    var t0 = Date.now();
    var raw = b64(document.getElementById('payload').textContent.trim());
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){ return crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:raw.subarray(0,16),iterations:ITER,hash:'SHA-256'},
        km, {name:'AES-GCM',length:256}, false, ['decrypt']); })
      .then(function(k){ return crypto.subtle.decrypt(
        {name:'AES-GCM',iv:raw.subarray(16,28)}, k, raw.subarray(28)); })
      .then(function(buf){
        console.log('unlock ms', Date.now()-t0);
        if (remember) safe(function(){ localStorage.setItem(PK, pass); });
        render(new TextDecoder().decode(buf));
      })
      .catch(function(){
        safe(function(){ localStorage.removeItem(PK); });   // a saved password that no longer works
        go.disabled = false; msg.className = 'err';
        msg.textContent = quiet ? 'Den gemte adgangskode virker ikke længere. Skriv den igen.' : 'Forkert adgangskode.';
        pw.value = ''; pw.focus();
      });
  }

  f.addEventListener('submit', function(ev){ ev.preventDefault(); unlock(pw.value, rm.checked, false); });

  var saved = safe(function(){ return localStorage.getItem(PK); }, null);
  if (saved) { rm.checked = true; unlock(saved, true, true); } else { pw.focus(); }
})();
</script>
